[package]
name = "drt"
version = "0.1.0"
edition = "2024"
description = "DRT development bench for Oklab and AgX-S2O3, built on wgpu 30 and Slang 2025.13+"
publish = false

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
image = { version = "0.25.6", default-features = false, features = ["exr", "hdr", "jpeg", "png", "webp"] }
half = { version = "2.7", features = ["bytemuck"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
pollster = "0.4"
wgpu = { version = "30.0.0", features = ["spirv"] }
